##############################################################################
# nginx.conf — LMS production server
# Place at: /etc/nginx/sites-available/lms
# Enable:   sudo ln -s /etc/nginx/sites-available/lms /etc/nginx/sites-enabled/
# Reload:   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes:
#   - React build is at /home/ubuntu/lms-app/frontend/build
#   - Node backend runs on port 5001 (via PM2)
#   - Server LAN IP or hostname set in server_name below
##############################################################################

# Tune worker connections for 100 concurrent users
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Upstream Node backend (PM2 cluster)
    upstream lms_backend {
        server 127.0.0.1:5001;
        keepalive 32;
    }

    server {
        listen 80;

        # Replace with your server's LAN IP or hostname
        # e.g.  server_name 192.168.1.100;
        server_name _;

        # ── React frontend (static files) ─────────────────────────────────
        root /home/ubuntu/lms-app/frontend/build;
        index index.html;

        # Cache hashed JS/CSS bundles aggressively (React adds hash to filenames)
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # All other frontend routes → index.html (React Router)
        location / {
            try_files $uri /index.html;
        }

        # ── Backend API (proxy to Node) ────────────────────────────────────
        location /api/ {
            proxy_pass         http://lms_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # Match body-parser limit in server.js
            client_max_body_size 200k;

            # Generous timeout for code execution (Judge0 can take ~10s)
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
